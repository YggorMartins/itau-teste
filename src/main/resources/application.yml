spring:
  application:
    name: itau-teste
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  mvc:
    async:
      request-timeout: 5s
    log-request-details: false
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  server-header: ""
  max-http-request-header-size: 8KB
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 20s
    max-connections: 8192
    accept-count: 100
    max-swallow-size: 10KB
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: false

app:
  statistics-window: 60s
  security:
    max-payload-bytes: 10240
    oauth2-enabled: false
    rate-limit:
      capacity: 100
      refill-tokens: 100
      refill-period: 1s
      temporary-block: 10s
      maximum-tracked-clients: 100000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
